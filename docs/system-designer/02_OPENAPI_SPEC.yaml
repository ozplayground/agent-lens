          description: URL 누락 또는 유효하지 않은 도메인

  /api/research/discover:
    post:
      summary: 키워드 또는 카테고리 기반 신규 고품질 소스 후보군 자율 발굴 및 추천
      tags: [Research]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DiscoverRequest'
      responses:
        '200':
          description: 발굴된 후보 목록 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverResponse'

  /api/research/register-candidate:
    post:
      summary: 리서치된 추천 후보 소스를 sources.json에 정규화하여 원클릭 등록
      tags: [Research]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterCandidateRequest'
      responses:
        '200':
          description: 후보 등록 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '400':
          description: 등록 실패

  /api/research/status:
    get:
      summary: 백엔드 자율 딥 리서치 엔진 현재 실행 상태 및 통계 조회
      tags: [Research]
      responses:
        '200':
          description: 딥 리서처 가동 상태
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchStatusResponse'

  /api/research/audit-logs:
    get:
      summary: 자율 딥 리서치 소스 심층 평가 및 판정 감사 일지 목록 조회
      tags: [Research]
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 30
      responses:
        '200':
          description: 평가 판정 감사 로그 목록
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResearchAuditLogsResponse'

  /api/research/run-deep:
    post:
      summary: 백엔드 자율 딥 리서치 파이프라인 즉시 실행 트리거
      tags: [Research]
      parameters:
        - name: max_candidates
          in: query
          required: false
          schema:
            type: integer
            default: 6
      responses:
        '200':
          description: 백그라운드 딥 리서치 사이클 가동 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeepResearchTriggerResponse'

  /api/schedule/status:
    get:
      summary: 정기 수집 스케줄러(APScheduler) 현황 및 최근 수집 감사 로그 조회
      tags: [Schedule]
      responses:
        '200':
          description: 스케줄러 현황 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleStatusResponse'

  /api/schedule/progress:
    get:
      summary: 실시간 점진적 스트림 수집 진행률 및 소스별 저장 건수 조회
      tags: [Schedule]
      responses:
        '200':
          description: 실시간 진행도 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CrawlProgressResponse'

  /api/schedule/trigger:
    post:
      summary: 비동기 백그라운드 실시간 점진적 수집 즉시 기동
      tags: [Schedule]
      responses:
        '200':
          description: 수집 시작 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleTriggerResponse'

  /api/schedule/reset-and-collect:
    post:
      summary: 데이터베이스 내 모든 아티클 및 크롤 로그 일괄 삭제 후 클린 재수집 기동
      tags: [Schedule]
      responses:
        '200':
          description: 초기화 및 재수집 시작 응답
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetAndCollectResponse'

  /api/trends/radar:
    get:
      summary: Tech Radar 에이전트 기술 스택 빈도 분석 및 급상승(Velocity) 데이터 반환
      tags: [Trends]
      responses:
        '200':
          description: 트렌드 레이더 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TechRadarResponse'

  /api/webhook/test:
    post:
      summary: Slack 또는 Discord 웹훅 엔드포인트 연동 테스트 메시지 발송
      tags: [Webhook]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookTestRequest'
      responses:
        '200':
          description: 테스트 메시지 전송 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '400':
          description: 웹훅 URL 오류 또는 전송 실패

  /api/webhook/send-briefing:
    post:
      summary: 오늘의 일일 AI 브리핑을 서식화하여 지정된 Slack/Discord 웹훅으로 발송
      tags: [Webhook]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookBriefingRequest'
      responses:
        '200':
          description: 브리핑 웹훅 디스패치 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '400':
          description: 전송 실패

  /api/stats:
    get:
      summary: 시스템 전체 소식 수량, 카테고리별/출처별 누적 통계 반환
      tags: [Stats]
      responses:
        '200':
          description: 통계 데이터 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'

  /api/mcp/info:
    get:
      summary: FastMCP 서버 정보, 제공 도구 목록 및 Claude Desktop 설정 스니펫
      tags: [MCP]
      responses:
        '200':
          description: MCP 서버 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/McpInfoResponse'

  /:
    get:
      summary: 루트 엔드포인트 (API 서비스 정보 및 Swagger 문서 링크)
      tags: [System]
      responses:
        '200':
          description: 서비스 기본 정보
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RootResponse'

  /health:
    get:
      summary: 서버 헬스체크 및 크롤러 실행 상태 반환
      tags: [System]
      responses:
        '200':
          description: 서버 상태 정상
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    ChatFocusFilter:
      type: object
      description: 수집 소식 타깃팅 포커스 필터 조건 (Focus Mode)
      properties:
        category:
          type: string
          enum: [all, harness, mcp_plugins_skills, agent_tech, ai_news]
          default: all
          description: 소식 카테고리 필터
          example: mcp_plugins_skills
        time_range:
          type: string
          enum: [all, 24h, 7d, 30d]
          default: all
          description: 수집 소식 기간 범위 필터
          example: 7d
        sort:
          type: string
          enum: [hot, latest, quality]
          default: hot
          description: 정렬 및 우선순위 기준 (hot 하이브리드 RAG 점수, latest 최신순, quality 품질 점수순)
          example: hot
        high_signal_only:
          type: boolean
          default: false
          description: 고신호 (품질점수 7.8 이상 Must-Read) 소식 한정 여부
          example: false

    ChatMessageHistory:
      type: object
      description: 이전 대화 턴 히스토리
      properties:
        role:
          type: string
          enum: [user, assistant, system]
          example: user
        content:
          type: string
          example: 이전 질의응답 내용입니다.
      required: [role, content]

    ChatStreamRequest:
      type: object
      description: 전용 AI 챗 실시간 스트리밍 질의 페이로드
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: 사용자 질문 프롬프트 본문
          example: 최근 공개된 SWE-bench 평가 하네스의 주요 변경 사항은?
        model:
          type: string
          enum: [claude-3-5-haiku, claude-3-5-sonnet, claude-3-5-opus]
          default: claude-3-5-sonnet
          description: Anthropic Claude 3.5/5.5 3-Tier 모델 식별자 (⚡ Haiku 5.5, 🎯 Sonnet 5.5 (기본값), 🧠 Opus 5.5). 미지정 시 기본값 `claude-3-5-sonnet` 적용.
          example: claude-3-5-sonnet
        scope:
          type: string
          enum: [scoped, global]
          default: global
          description: 검색 스코프 모드 (scoped 단일 기사 격리 / global 전체 코퍼스 지식 검색)
          example: global
        source_id:
          type: integer
          nullable: true
          description: Scoped 모드 시 컨텍스트로 주입할 대상 기사 고유 ID
          example: 42
        session_id:
          type: string
          format: uuid
          nullable: true
          description: 대화 세션 식별자 (UUID v4). 지정된 경우 해당 세션에 사용자 질문과 어시스턴트 완료 답변이 자동으로 트랜잭션 영속화됩니다.
          example: 7b6a48f2-2973-45f6-8c46-9562725b821a
        history:
          type: array
          description: 멀티턴 대화 연속성 보존을 위한 이전 대화 이력 목록 (최근 최대 10턴/20개 메시지 슬라이딩 윈도우)
          items:
            $ref: '#/components/schemas/ChatMessageHistory'
        top_k:
          type: integer
          default: 5
          minimum: 1
          maximum: 10
          description: Global 모드 시 RAG 검색으로 주입할 상위 아티클 수
          example: 5
        filters:
          $ref: '#/components/schemas/ChatFocusFilter'
          nullable: true
          description: 수집 소식 타깃팅 포커스 필터 (카테고리, 기간, 정렬, 고신호 한정)
      required: [question]

    ChatSessionSummary:
      type: object
      description: 대화 세션 요약 메타데이터 (히스토리 사이드바 및 모바일 드로어 렌더링용)
      properties:
        id:
          type: string
          format: uuid
          description: 대화 세션 고유 식별자 (UUID v4)
          example: 7b6a48f2-2973-45f6-8c46-9562725b821a
        title:
          type: string
          maxLength: 100
          description: 세션 제목 (첫 질문 앞 30자 자동 타이틀링 또는 사용자 지정)
          example: LangGraph v0.3 Functional API 설명
        created_at:
          type: string
          format: date-time
          description: 세션 최초 생성 일시 (ISO 8601 UTC)
          example: '2026-09-28T08:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: 마지막 질의 및 수정 일시 (ISO 8601 UTC, 정렬 인덱스)
          example: '2026-09-28T08:15:30Z'
        scope_mode:
          type: string
          enum: [scoped, global]
          description: 검색 스코프 모드
          example: scoped
        active_source_id:
          type: integer
          nullable: true
          description: Scoped 모드 기사 ID (news_items.id 외래키)
          example: 42
        message_count:
          type: integer
          description: 세션 내 누적 메시지 총 건수
          example: 4
        last_message_preview:
          type: string
          nullable: true
          description: 마지막 메시지 본문 미리보기 (최대 100자)
          example: '## 1. 핵심 아키텍처 및 동작 원리...'
        active_filters:
          $ref: '#/components/schemas/ChatFocusFilter'
          nullable: true
          description: Global 모드 시 적용된 타깃 포커스 필터
      required: [id, title, created_at, updated_at, scope_mode, message_count]

    ChatMessageItem:
      type: object
      description: 개별 대화 턴 메시지 엔티티
      properties:
        id:
          type: string
          format: uuid
          description: 메시지 고유 식별자 (UUID v4)
          example: a1b2c3d4-e5f6-7a8b-9c0d-1e2f3a4b5c6d
        session_id:
          type: string
          format: uuid
          description: 소속 세션 UUID v4 (외래키, ON DELETE CASCADE)
          example: 7b6a48f2-2973-45f6-8c46-9562725b821a
        role:
          type: string
          enum: [user, assistant, system]
          description: 화자 역할
          example: user
        content:
          type: string
          description: 메시지 본문 내용 (마크다운)
          example: LangGraph v0.3의 Functional API 변경점을 설명해줘
        created_at:
          type: string
          format: date-time
          description: 메시지 발송/생성 일시 (ISO 8601 UTC)
          example: '2026-09-28T08:00:00Z'
        sources:
          type: array
          nullable: true
          description: 어시스턴트 답변에 인용된 원본 및 보충 출처 목록 (JSON/TEXT 영속화)
          items:
            $ref: '#/components/schemas/ChatSourceItem'
        status:
          type: string
          enum: [pending, streaming, completed, error, aborted]
          description: 메시지 상태
          example: completed
        model:
          type: string
          nullable: true
          description: 답변 생성에 사용된 Claude 모델 식별자
          example: claude-3-5-sonnet-latest
        latency_ms:
          type: integer
          nullable: true
          description: 응답 생성 소요 시간 (밀리초)
          example: 3450
      required: [id, session_id, role, content, created_at, status]

    ChatSessionDetail:
      type: object
      description: 대화 세션 전체 상세 정보 및 정렬된 대화 메시지 이력 (멀티턴 완전 복원용)
      properties:
        id:
          type: string
          format: uuid
          description: 세션 UUID v4
          example: 7b6a48f2-2973-45f6-8c46-9562725b821a
        title:
          type: string
          maxLength: 100
          description: 세션 제목
          example: LangGraph v0.3 Functional API 설명
        created_at:
          type: string
          format: date-time
          description: 세션 생성 일시 (ISO 8601 UTC)
          example: '2026-09-28T08:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: 마지막 질의 일시 (ISO 8601 UTC)
          example: '2026-09-28T08:15:30Z'
        scope_mode:
          type: string
          enum: [scoped, global]
          description: 검색 스코프 모드
          example: scoped
        active_source_id:
          type: integer
          nullable: true
          description: Scoped 모드 대상 기사 ID (news_items.id 외래키)
          example: 42
        active_source:
          $ref: '#/components/schemas/ChatSourceDetailResponse'
          nullable: true
          description: Scoped 기사 메타데이터 상세 (클라이언트 칩 및 컨텍스트 복원용)
        active_filters:
          $ref: '#/components/schemas/ChatFocusFilter'
          nullable: true
          description: Global 모드 적용 포커스 필터
        messages:
          type: array
          description: 시간순(created_at ASC)으로 정렬된 전체 대화 메시지 목록
          items:
            $ref: '#/components/schemas/ChatMessageItem'
      required: [id, title, created_at, updated_at, scope_mode, messages]

    ChatSessionCreateRequest:
      type: object
      description: 대화 세션 생성 또는 업서트 요청 페이로드
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: 클라이언트 사전 발급 UUID v4 (미지정 시 서버에서 자동 생성)
          example: 7b6a48f2-2973-45f6-8c46-9562725b821a
        title:
          type: string
          maxLength: 100
          default: 새 대화
          description: 세션 제목 (기본값 '새 대화', 최초 질의 완료 시 앞 30자 자동 타이틀링)
          example: LangGraph v0.3 Functional API 설명
        scope_mode:
          type: string
          enum: [scoped, global]
          default: global
          description: 검색 스코프 모드
          example: global
        active_source_id:
          type: integer
          nullable: true
          description: Scoped 모드 대상 기사 ID
          example: 42
        active_filters:
          $ref: '#/components/schemas/ChatFocusFilter'
          nullable: true
          description: 타깃 포커스 필터
        messages:
          type: array
          description: 초기 또는 동기화할 대화 메시지 목록 (선택)
          items:
            $ref: '#/components/schemas/ChatMessageItem'
      required: []

    ChatQueryRequest:
      type: object
      description: 전용 AI 챗 동기식 단건 질의 페이로드
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
          description: 사용자 질문 프롬프트 본문
          example: LangGraph와 AutoGen의 멀티에이전트 패턴 차이점은?
        model:
          type: string
          enum: [claude-3-5-haiku, claude-3-5-sonnet, claude-3-5-opus]
          default: claude-3-5-sonnet
          description: Anthropic Claude 3.5/5.5 3-Tier 모델 식별자 (⚡ Haiku 5.5, 🎯 Sonnet 5.5 (기본값), 🧠 Opus 5.5). 미지정 시 기본값 `claude-3-5-sonnet` 적용.
          example: claude-3-5-sonnet
        scope:
          type: string
          enum: [scoped, global]
          default: global
          description: 검색 스코프 모드
          example: global
        source_id:
          type: integer
          nullable: true
          description: Scoped 모드 대상 기사 고유 ID
          example: 105
        session_id:
          type: string
          nullable: true
          description: 대화 세션 식별자
          example: 7b6a48f2-2973-45f6-8c46-9562725b821a
        history:
          type: array
          description: 이전 대화 이력 목록
          items:
            $ref: '#/components/schemas/ChatMessageHistory'
        top_k:
          type: integer
          default: 5
          minimum: 1
          maximum: 10
          description: 주입할 상위 아티클 수
          example: 5
        filters:
          $ref: '#/components/schemas/ChatFocusFilter'
          nullable: true
          description: 수집 소식 타깃팅 포커스 필터 (카테고리, 기간, 정렬, 고신호 한정)
      required: [question]

    ChatStatusStep:
      type: string
      enum: [extracting_source, evaluating_sufficiency, agentic_searching, synthesizing]
      description: 에이전틱 리서치 워크플로우 실시간 단계 코드
      example: extracting_source

    StatusPayload:
      type: object
      description: SSE event:status 데이터 페이로드 (실시간 진행 단계 통지)
      properties:
        step:
