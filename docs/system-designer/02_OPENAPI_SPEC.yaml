    ErrorResponse:
      type: object
      description: 표준 비즈니스 에러 응답
      properties:
        error_code:
          type: string
          description: |
            정의된 표준 비즈니스 에러 코드 목록:
            - ERR_CLAUDE_API_KEY_MISSING: Anthropic Claude API 키 미설정 (엄격 프로덕션 키 부재)
            - ERR_ANTHROPIC_KEY_MISSING: Anthropic Claude API 키 미설정 별칭
            - ERR_CLAUDE_QUOTA_EXCEEDED: Anthropic Claude TPM/RPM 호출 한도 초과 (HTTP 429)
            - ERR_ANTHROPIC_RATE_LIMIT: Anthropic Claude 호출 한도 초과 별칭 (HTTP 429)
            - ERR_CLAUDE_OVERLOADED: Anthropic 서버 과부하 (HTTP 503 / 529)
            - ERR_ANTHROPIC_OVERLOADED: Anthropic 서버 과부하 별칭
            - ERR_INVALID_MODEL_TIER: 허용되지 않은 모델 티어 코드 요청 (HTTP 400)
            - ERR_SONNET_SCHEMA_VALIDATION: Claude Sonnet 5.5 수집 Pydantic JSON 스키마 검증 실패
            - ERR_STREAM_ABORTED_BY_USER: 모델 전환 또는 브라우저 이탈 등으로 인한 스트림 중단 (HTTP 499)
            - ERR_ARTICLE_EXTRACTION_FAIL: 원문 웹페이지 404/403 또는 본문 추출 실패 (HTTP 502)
            - ERR_LLM_PROVIDER_UNAVAILABLE: 가용한 LLM 프로바이더 엔진 미설정 (엄격 프로덕션 키 부재)
            - ERR_LLM_UPSTREAM_FAILED: 외부 LLM API 통신 실패 또는 5xx 장애
            - ERR_LLM_QUOTA_EXCEEDED: 외부 LLM API 호출 한도 초과 (HTTP 429)
            - ERR_LLM_STREAM_FAILED: 스트리밍 중간 단절 또는 네트워크 타임아웃
            - ERR_LLM_PAYLOAD_PARSE_FAILED: LLM 응답 JSON 파싱 실패
            - ERR_CHAT_PAYLOAD_EMPTY: 질문 본문 공백 또는 빈 문자열
            - ERR_CHAT_PAYLOAD_TOO_LARGE: 질문 2,000자 초과
            - ERR_INVALID_SCOPE_PARAM: 유효하지 않은 스코프 파라미터 (scoped / global 외 값)
            - ERR_HANDOVER_SOURCE_NOT_FOUND: Scoped 모드 기사 미존재 (HTTP 404)
            - ERR_SEARCH_QUERY_TOO_SHORT: 코퍼스 지식 검색어 2글자 미만
            - ERR_SESSION_NOT_FOUND: 요청한 세션 ID 미존재 (HTTP 404)
            - ERR_SESSION_DELETE_FAILED: 세션 레코드 삭제 트랜잭션 실패
            - ERR_SESSION_INVALID_UUID: 세션 ID UUID v4 형식 불일치
            - ERR_SESSION_CONFLICT_STREAMING: 스트리밍 중 충돌 발생
            - ERR_FEED_FETCH_FAILED: 피드 조회 실패 또는 서버 내부 오류
            - ERR_FEED_CARD_NOT_FOUND: 포커스된 인덱스의 카드 미존재
            - ERR_INVALID_PAGE_PARAM: 음수 또는 유효하지 않은 페이징 파라미터
            - ERR_SCRAPE_BLOCKED: 원본 사이트 페이월 / 403 차단 (우아한 다운그레이드)
            - ERR_SCRAPE_EMPTY_CONTENT: 원본 본문 500자 미만 (요약 모드 다운그레이드)
            - ERR_SCRAPE_TIMEOUT: 원본 사이트 스크래핑 5.0초 초과
            - ERR_COLLECTION_IN_PROGRESS: 이미 수집 작업이 진행 중임 (HTTP 409)
            - ERR_COLLECTION_FAILED: 수집 파이프라인 내부 에러
            - ERR_RESET_CONFLICT: 수집 중 리셋 또는 중복 작업 충돌 (HTTP 409)
            - ERR_MCP_INVALID_TOOL_ARG: FastMCP 도구 인자 누락 또는 유효성 오류
            - ERR_MCP_TOOL_EXECUTION_FAILED: FastMCP 도구 실행 실패
            - ERR_SERVER_INTERNAL: 서버 내부 처리 중 예외 발생
          enum:
            - ERR_CLAUDE_API_KEY_MISSING
            - ERR_ANTHROPIC_KEY_MISSING
            - ERR_CLAUDE_QUOTA_EXCEEDED
            - ERR_ANTHROPIC_RATE_LIMIT
            - ERR_CLAUDE_OVERLOADED
            - ERR_ANTHROPIC_OVERLOADED
            - ERR_INVALID_MODEL_TIER
            - ERR_SONNET_SCHEMA_VALIDATION
            - ERR_STREAM_ABORTED_BY_USER
            - ERR_ARTICLE_EXTRACTION_FAIL
            - ERR_LLM_PROVIDER_UNAVAILABLE
            - ERR_LLM_UPSTREAM_FAILED
            - ERR_LLM_QUOTA_EXCEEDED
            - ERR_LLM_STREAM_FAILED
            - ERR_LLM_PAYLOAD_PARSE_FAILED
            - ERR_CHAT_PAYLOAD_EMPTY
            - ERR_CHAT_PAYLOAD_TOO_LARGE
            - ERR_INVALID_SCOPE_PARAM
            - ERR_HANDOVER_SOURCE_NOT_FOUND
            - ERR_SEARCH_QUERY_TOO_SHORT
            - ERR_SESSION_NOT_FOUND
            - ERR_SESSION_DELETE_FAILED
            - ERR_SESSION_INVALID_UUID
            - ERR_SESSION_CONFLICT_STREAMING
            - ERR_FEED_FETCH_FAILED
            - ERR_FEED_CARD_NOT_FOUND
            - ERR_INVALID_PAGE_PARAM
            - ERR_SCRAPE_BLOCKED
            - ERR_SCRAPE_EMPTY_CONTENT
            - ERR_SCRAPE_TIMEOUT
            - ERR_COLLECTION_IN_PROGRESS
            - ERR_COLLECTION_FAILED
            - ERR_RESET_CONFLICT
            - ERR_MCP_INVALID_TOOL_ARG
            - ERR_MCP_TOOL_EXECUTION_FAILED
            - ERR_SERVER_INTERNAL
          example: ERR_HANDOVER_SOURCE_NOT_FOUND
        message:
          type: string
          description: 사용자 친화적 에러 메시지
          example: 요청하신 기사를 찾을 수 없습니다.
        details:
          type: object
          nullable: true
          description: 상세 디버그 정보
      required: [error_code, message]

    TokenUsageMeta:
      type: object
      description: Anthropic Claude 토큰 소비 및 프롬프트 캐시 적중 메타데이터
      properties:
        input_tokens:
          type: integer
          description: 모델에 주입된 총 입력 토큰 수
          example: 1250
        output_tokens:
