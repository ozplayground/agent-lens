        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: high_signal_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: High Signal Only
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: hot
          title: Sort
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      x-agentlens-code: backend/app/api/news.py:47
      x-agentlens-frontend: fetchNewsFeed
      description: |-
        [보충]
        category·source 는 소문자로 바꿔 일치 비교(all 이면 필터 없음). search 는 앞뒤 공백 제거 후 title·summary·tags·tech_stack·why_it_matters 에 ILIKE %search% (OR). sort: latest(published_at desc), top(raw_score desc), quality(quality_score desc, hotness_score desc), 그 밖의 값은 모두 hot(hotness_score desc, published_at desc). offset=(page-1)*size, total_pages=ceil(total/size) (total 0 이면 1). tags·tech_stack 은 쉼표 문자열을 배열로, tldr_bullets 는 JSON 파싱(실패 시 []), quality_score 0/NULL 은 6.0 (news.py:17).
      x-agentlens-diff:
      - description 보충
