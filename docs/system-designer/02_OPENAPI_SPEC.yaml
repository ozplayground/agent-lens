            / ERR_CHAT_PAYLOAD_TOO_LARGE / ERR_INVALID_SCOPE_PARAM / ERR_SESSION_INVALID_UUID: session_id 가 있는데 UUID 가 아님 (backend/app/api/chat.py:101-106, 입력값 echo 없음) / ERR_INVALID_MODEL_TIER: model_tier
