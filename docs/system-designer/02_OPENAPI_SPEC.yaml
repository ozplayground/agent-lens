  /api/schedule/trigger:
    post:
      tags:
      - Schedule
      summary: Trigger Manual Crawl
      description: |-
        Starts progressive streaming collection in background and responds instantly.

        ---
        [보충]
        collector_manager.is_busy() 가 거짓이면 BackgroundTasks 로 collect_all() 을 시작하고 바로 응답한다. is_busy 는 이 프로세스 플래그와 프로세스 사이 수집 잠금(<db>.crawl.lock, 비차단 flock)을 함께 본다. 수집: 외부 소스 6종 호출, 항목별 LLM 평가(DB 잠금 밖), 소스별 한 트랜잭션으로 news_items INSERT/UPDATE, 끝에 crawl_logs 1행.
      operationId: trigger_manual_crawl_api_schedule_trigger_post
      responses:
