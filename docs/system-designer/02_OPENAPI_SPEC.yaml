openapi: 3.1.0
info:
  title: AgentLens API
  version: 0.2.0
  description: |
    Global AI Agent, Harness & MCP Vertical News Curation Platform and Dedicated AI Chat / Personal RAG RESTful API Specification
    (0.2.0 Gemini 무단 폴백 전면 차단, Anthropic Claude 3.5/5.5 전용 고정, Claude Sonnet 5.5 전담 수집 파이프라인 [FUNC-COLL-005] & 프롬프트 캐싱, AI 챗 상단 헤더 & 입력창 듀얼 모델 선택기 [FUNC-CHAT-013: claude-3-5-haiku, claude-3-5-sonnet, claude-3-5-opus], Zero-Leak API 키 보안 거버넌스 [POL-SEC-004], Multi-LLM Provider Resiliency & Mock Fallback Chain [FUNC-SYS-005], Dual-Layer Chat Session Persistence & Multi-turn Continuity [FUNC-CHAT-012], Live Full-Text Scraping & SQLite full_content Caching [FUNC-CHAT-009], Agentic Web Search [FUNC-CHAT-010], 4-Section Structured Engineering Report & Markdown Export [FUNC-CHAT-011, REQ-EXPORT-001], Power User Keyboard Shortcuts & Command Palette [FUNC-NAV-001, FUNC-FEED-007], Zero-Flicker SSR Dark Mode [FUNC-THEME-001], and Local FastMCP Server Integration [FUNC-SYS-004]).
servers:
  - url: http://localhost:8000
    description: Local Backend Server

tags:
  - name: Chat
    description: 전용 AI 챗 워크스페이스, 세션 영속화 및 멀티턴 복원, Mock LLM Fallback 체인 (503 에러 원천 차단), 실시간 전문 스크래핑 & 자율 보충 검색 에이전틱 워크플로우, 4단 구조화 엔지니어링 리포트 및 개인 지식 RAG
  - name: News
    description: 기사 피드 조회, 단건 상세, 인라인 Ask AI 및 RSS 내보내기
  - name: Briefing
    description: 일일 종합 브리핑 자동 합성, Notion/이메일 발행 및 연동 설정
  - name: Sources
    description: 수집 대상 피드/저장소 목록, 신규 등록, 활성화 토글 및 삭제
  - name: Research
    description: URL 자동 감지, 신규 소스 발굴 추천 및 자율 딥 리서치 파이프라인
  - name: Schedule
    description: 정기 크론 수집 현황, 실시간 진행률, 수동 즉시 수집 및 클린 재수집
  - name: Trends
    description: Tech Radar 기술 스택 랭킹, 카테고리 점유율 및 급상승(Surging) 지표
  - name: Webhook
    description: Slack Block Kit 및 Discord Rich Embeds 웹훅 발송
  - name: Stats
    description: 데이터베이스 누적 아티클, 카테고리 및 출처별 통계
  - name: Mcp
    description: FastMCP 서버 정보 및 Claude Desktop / Cursor IDE 도구 연동 가이드
  - name: System
    description: 시스템 루트 메타데이터 및 헬스체크

paths:
  /api/chat/stream:
    post:
      summary: 전용 AI 챗 Claude 3-Tier SSE 다중 이벤트 실시간 스트리밍 질의응답 (Server-Sent Events)
      description: |
        단일 기사 집중(Scoped Focus) 또는 타깃팅된 전체 뉴스 코퍼스 지식 검색(Global Corpus) 모드를 기반으로
        자율 에이전틱 리서치 워크플로우를 가동하여 실시간 마크다운 답변을 Server-Sent Events(SSE)로 스트리밍합니다.
        
        [Anthropic Claude 3.5/5.5 멀티 모델 라우팅 및 인라인 동적 전환 (FUNC-CHAT-013)]
        - 사용자의 작업 의도에 맞춘 3-Tier 모델(`claude-3-5-haiku`, `claude-3-5-sonnet`, `claude-3-5-opus`, 기본값: `claude-3-5-sonnet`)을 지원합니다.
        - 대화 도중 모델을 교체하더라도 세션을 초기화하지 않고 기존 멀티턴 맥락(최대 10턴, 3,000토큰)을 100% 무손실 인계(Zero Context Erasure)합니다.
        
        [백엔드 LLM 장애 복원력 및 Mock Provider / Fallback 체인 (FUNC-SYS-005, REQ-LLM-001)]
        - 사전 가용성 검증(`check_provider_available`):
          1) 테스트 환경(`TESTING=True` 또는 `PYTEST_CURRENT_TEST` 감지) 시 외부 API 키 유무와 무관하게 즉각 `MockLLMProvider`로 안전 전환되어 503 에러 발생을 원천 차단하고 100% 정상 스트림을 공급합니다.
          2) 일반 프로덕션 환경에서 API 키가 누락되었더라도 `ALLOW_MOCK_FALLBACK=True` 구성 시 안전한 Mock 스트림으로 폴백합니다.
          3) 엄격한 프로덕션(`ALLOW_MOCK_FALLBACK=False`) 환경에서만 관리자 조치를 위해 `503 Service Unavailable` (`ERR_CLAUDE_API_KEY_MISSING` / `ERR_ANTHROPIC_KEY_MISSING`)을 반환합니다.
        
        [Zero-Leak API 키 보안 거버넌스 및 서버 사이드 격리 (POL-SEC-004)]
        - 브라우저 클라이언트에 Anthropic API 키를 일체 노출하지 않으며, 백엔드 단독 `.env` 보관 및 FastAPI SSE 프록시 스트리밍으로 통신합니다.
        
        [대화 세션 연동 및 자동 영속화 (Session Persistence & Multi-turn Continuity, FUNC-CHAT-012)]
        - 클라이언트는 요청 페이로드에 `session_id`를 지정하여 대화 세션을 바인딩합니다.
        - 스트리밍 응답이 완료(`event: done`)되는 즉시, 백엔드는 단일 ACID 트랜잭션 내에서:
          1) 사용자 질의 메시지(role: 'user', content: question, status: 'completed') INSERT
          2) AI 어시스턴트 응답 메시지(role: 'assistant', content: answer, sources: sources, status: 'completed', model, latency_ms) INSERT
          3) 세션의 `updated_at` 타임스탬프 갱신 및 최초 턴 질문 기준 앞 30자 자동 타이틀링(Auto-Titling)을 수행합니다.
        
        [에이전틱 워크플로우 및 SSE 다중 이벤트 스트림 프로토콜]
        1. event: status (StatusPayload)
           - 단계별 진행 상태를 실시간 통지합니다:
             - 'extracting_source': 원본 URL 실시간 전문 비동기 스크래핑 (Trafilatura/Readability, 캐시 히트 시 0ms)
             - 'evaluating_sufficiency': LLM 기반 원본 본문 정보 충실도 자체 평가
             - 'agentic_searching': 지식 결손(설치법, 비교, 패치) 또는 페이월 차단 감지 시 앵커링 웹 검색 자율 가동 (DuckDuckGo/Tavily)
             - 'synthesizing': Senior Staff Architect 4단 엔지니어링 리포트 프롬프트 조립 (Claude 프롬프트 캐싱 적용)
        2. event: sources (SourcesPayload)
           - 답변 생성에 주입된 원본 소스([1]) 및 외부 보충 출처([S1], [S2]) 목록을 분리하여 선행 전달합니다.
           - ChatFocusFilter 바인딩 내역 및 기간 자동 완화 여부(is_relaxed)를 포함합니다.
        3. event: token (TokenPayload)
           - 실제 Anthropic Claude 모델 또는 MockLLMProvider가 생성한 순수 마크다운 텍스트 토큰을 실시간 스트리밍합니다.
           - 피상적 2줄 요약 앵무새 답변을 차단하고 4대 섹션 구조화 리포트를 생성합니다.
        4. event: done (DonePayload)
           - 스트리밍 완료 통계(session_id, model, model_tier, sources_count, latency_ms, usage)를 전달하고 연결을 종료합니다.
           - 클라이언트 UI는 스텝 트래커를 접이식 완료 아코디언으로 즉시 축소 전환하고 어시스턴트 카드 푸터에 실제 모델 배지와 레이턴시를 렌더링합니다.
        5. event: error (StreamErrorPayload)
           - 스트림 진행 도중 외부 LLM 단절 또는 타임아웃 발생 시 에러 신호를 방출하고 정상 종료합니다.
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatStreamRequest'
      responses:
        '200':
          description: 실시간 SSE 다중 이벤트 스트림 수립 성공 (text/event-stream) - 실제 Claude 스트림 또는 Mock Fallback 스트림
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-Sent Events 다중 이벤트 스트림 (status, sources, token, done, error)
              examples:
                live_claude_stream:
                  summary: 실제 Claude 3.5 Sonnet 스트리밍 응답 예시
                  value: |
                    event: status
                    data: {"step":"extracting_source","label":"🌐 원본 소스 본문 추출 중 (Trafilatura)...","timestamp":"2026-10-19T09:40:01Z","progress":20}

                    event: status
                    data: {"step":"evaluating_sufficiency","label":"🧠 본문 정보 충실도 분석 중...","timestamp":"2026-10-19T09:40:02Z","progress":45}

                    event: status
                    data: {"step":"agentic_searching","label":"🔍 보충 기술 문서 자율 검색 중...","timestamp":"2026-10-19T09:40:03Z","progress":65,"query":"LangGraph v0.3 install pip python","sources_found":2}

                    event: status
                    data: {"step":"synthesizing","label":"📝 심층 엔지니어링 리포트 종합 중 (Sonnet 5.5)...","timestamp":"2026-10-19T09:40:04Z","progress":85}

                    event: sources
                    data: {"sources":[{"index":1,"type":"primary","id":42,"title":"LangGraph v0.3 Release Notes","url":"https://github.com/langchain-ai/langgraph","source":"github","category":"agent_tech","quality_score":9.2,"domain":"github.com"},{"index":"S1","type":"supplementary","id":null,"title":"LangGraph Installation & Quickstart Guide","url":"https://langchain-ai.github.io/langgraph/how-tos/installation/","source":"web_search","category":null,"quality_score":null,"domain":"langchain-ai.github.io"}],"applied_filters":null,"is_relaxed":false,"primary_count":1,"supplementary_count":1}

                    event: token
                    data: {"token":"## 1. 핵심 아키텍처 및 동작 원리\n\n"}

                    event: token
                    data: {"token":"LangGraph v0.3은 분산 상태 머신(State Machine) 그래프를 기반으로..."}

                    event: done
                    data: {"done":true,"session_id":"7b6a48f2-2973-45f6-8c46-9562725b821a","model":"claude-3-5-sonnet-latest","model_tier":"sonnet","sources_count":2,"primary_count":1,"supplementary_count":1,"latency_ms":642,"usage":{"input_tokens":1250,"output_tokens":840,"cache_read_input_tokens":2500,"cache_creation_input_tokens":0}}
                mock_fallback_stream:
                  summary: 테스트/키 미등록 시 Mock LLM Provider 폴백 응답 예시 (Zero 503)
                  value: |
                    event: status
                    data: {"step":"extracting_source","label":"🌐 원본 소스 본문 추출 중 (Mock Fallback)...","timestamp":"2026-10-19T09:40:01Z","progress":20}

                    event: status
                    data: {"step":"synthesizing","label":"📝 Mock 엔지니어링 리포트 종합 중...","timestamp":"2026-10-19T09:40:02Z","progress":85}

                    event: sources
                    data: {"sources":[{"index":1,"type":"primary","id":42,"title":"LangGraph v0.3 Mock Source","url":"https://example.com/mock","source":"github","category":"agent_tech","quality_score":8.5,"domain":"example.com"}],"applied_filters":null,"is_relaxed":false,"primary_count":1,"supplementary_count":0}

                    event: token
                    data: {"token":"## 1. 핵심 아키텍처 및 동작 원리 (Mock Fallback)\n\n본 응답은 테스트 및 Mock Fallback 체인에 의해 생성된 엔지니어링 분석 리포트입니다.\n\n## 2. 주요 기능 및 코드 구현 예시\n\n```python\n# Mock Code Example\nimport langgraph\nprint('AgentLens Mock Fallback Active')\n```\n\n## 3. 기존 기술 대비 차별점 및 벤치마크\n\n- 테스트 환경 503 에러 원천 차단 및 무중단 TDD 스트리밍 보장\n\n## 4. 실무 도입 시 고려사항 및 트레이드오프\n\n- 프로덕션 배포 시 유효한 ANTHROPIC_API_KEY 주입 권장\n"}

                    event: done
                    data: {"done":true,"session_id":"7b6a48f2-2973-45f6-8c46-9562725b821a","model":"mock-provider","model_tier":"sonnet","sources_count":1,"primary_count":1,"supplementary_count":0,"latency_ms":120}
        '400':
          description: 유효하지 않은 요청 파라미터 (빈 질문 ERR_CHAT_PAYLOAD_EMPTY, 2,000자 초과 ERR_CHAT_PAYLOAD_TOO_LARGE, 지원하지 않는 스코프 ERR_INVALID_SCOPE_PARAM, 미지원 모델 티어 ERR_INVALID_MODEL_TIER 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scoped 모드에서 지정된 source_id 기사를 찾을 수 없음 (ERR_HANDOVER_SOURCE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Anthropic Claude TPM/RPM 호출 한도 초과 (ERR_CLAUDE_QUOTA_EXCEEDED, ERR_ANTHROPIC_RATE_LIMIT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '499':
          description: 클라이언트 요청 취소 또는 모델 전환 등으로 진행 중 스트림 중단 (ERR_STREAM_ABORTED_BY_USER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 외부 LLM 업스트림 통신 실패 또는 외부 웹 검색 실패 (ERR_LLM_UPSTREAM_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 엄격 프로덕션 환경에서 Anthropic API 키 미설정(ERR_CLAUDE_API_KEY_MISSING) 또는 Anthropic 서버 과부하(ERR_CLAUDE_OVERLOADED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: 원본 스크래핑 또는 스트리밍 백엔드 응답 타임아웃 (ERR_CHAT_STREAM_TIMEOUT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chat/query:
    post:
      summary: 전용 AI 챗 Claude 3-Tier 동기식 단건 질의응답 (Non-streaming)
      description: |
        스트리밍 없이 단일 JSON 응답으로 질문에 대한 Claude 모델 답변 및 인용 출처 목록을 반환합니다.
        3-Tier 모델(`claude-3-5-haiku`, `claude-3-5-sonnet`, `claude-3-5-opus`) 선택 및 토큰 소비 메타데이터(usage)를 제공합니다.
        포커스 필터(ChatFocusFilter: 카테고리, 기간, 정렬, 고신호 한정)가 RAG 검색 쿼리에 동적으로 바인딩됩니다.
        REST 클라이언트, CLI 도구, 자동화 테스트 및 배치 작업에 적합합니다.
        
        [Mock Provider Fallback (FUNC-SYS-005)]
        테스트 환경(`TESTING=True`, `pytest`) 또는 `ALLOW_MOCK_FALLBACK=True` 설정 시, 외부 API 키 부재 시에도 503 에러 없이 200 OK 상태로 Mock 4단 리포트 JSON을 정상 반환합니다.
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatQueryRequest'
      responses:
        '200':
          description: AI 답변 및 인용 출처 반환 성공 (실제 Claude 모델 답변 또는 Mock Fallback 답변)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatQueryResponse'
        '400':
          description: 유효하지 않은 요청 파라미터 (ERR_CHAT_PAYLOAD_EMPTY, ERR_CHAT_PAYLOAD_TOO_LARGE, ERR_INVALID_SCOPE_PARAM, ERR_INVALID_MODEL_TIER)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Scoped 모드에서 대상 기사를 찾을 수 없음 (ERR_HANDOVER_SOURCE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Claude API 호출 한도 초과 (ERR_CLAUDE_QUOTA_EXCEEDED, ERR_ANTHROPIC_RATE_LIMIT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: 외부 LLM 업스트림 통신 실패 (ERR_LLM_UPSTREAM_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: 엄격 프로덕션 환경에서 Anthropic API 키 미설정 (ERR_CLAUDE_API_KEY_MISSING) 또는 과부하 (ERR_CLAUDE_OVERLOADED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류 (ERR_SERVER_INTERNAL)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chat/sources/{source_id}:
    get:
      summary: 컨텍스트 기사 메타데이터 및 상세 정보 조회
      description: |
        뉴스 피드/상세 모달에서 전용 챗으로의 컨텍스트 핸드오버(Context Handover) 시 활성 기사 칩을 생성하거나,
        답변 내 인라인 인용 뱃지([N]) 호버/탭 시 출처 뉴스 프리뷰 팝오버를 렌더링하기 위한 기사 상세 메타데이터를 조회합니다.
      tags: [Chat]
      parameters:
        - name: source_id
          in: path
          required: true
          description: 조회 대상 뉴스 기사 고유 ID
          schema:
            type: integer
      responses:
        '200':
          description: 기사 상세 메타데이터 반환 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSourceDetailResponse'
        '404':
          description: 대상 기사를 찾을 수 없음 (ERR_HANDOVER_SOURCE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chat/search:
    get:
      summary: 코퍼스 지식 검색 프리뷰 (FTS5 + BM25 + Quality 스코어링 + Focus Filter)
      description: |
        LLM 답변 생성 없이 SQLite FTS5 역색인 검색과 하이브리드 RAG 랭킹 공식
        (BM25 50% + Quality Score 30% + Recency 20%)을 적용하여
        매칭되는 고신호 기사 청크 목록을 사전 검색/프리뷰합니다.
        카테고리, 기간 범위(time_range), 정렬 기준(sort), 고신호 한정(high_signal_only) 파라미터를 지원합니다.
      tags: [Chat]
      parameters:
        - name: q
          in: query
          required: true
          description: 검색 질의 키워드
          schema:
            type: string
            minLength: 2
        - name: top_k
          in: query
          required: false
          description: 반환할 상위 청크 수 (기본값 5, 최대 20)
          schema:
            type: integer
            default: 5
            minimum: 1
            maximum: 20
        - name: min_quality
          in: query
          required: false
          description: 최소 품질 점수 필터 (기본값 5.0, 노이즈 컷오프)
          schema:
            type: number
            default: 5.0
            minimum: 1.0
            maximum: 10.0
        - name: category
          in: query
          required: false
          description: 특정 카테고리 한정 필터
          schema:
            type: string
            enum: [all, harness, mcp_plugins_skills, agent_tech, ai_news]
            default: all
        - name: time_range
          in: query
          required: false
          description: 수집 소식 기간 범위 필터 (24h, 7d, 30d, all)
          schema:
            type: string
            enum: [all, 24h, 7d, 30d]
            default: all
        - name: sort
          in: query
          required: false
          description: 정렬 및 랭킹 우선순위 (hot, latest, quality)
          schema:
            type: string
            enum: [hot, latest, quality]
            default: hot
        - name: high_signal_only
          in: query
          required: false
          description: 고신호 (품질점수 7.8 이상 Must-Read) 소식 한정 여부
          schema:
            type: boolean
            default: false
        - name: source
          in: query
          required: false
          description: 특정 출처 한정 필터
          schema:
            type: string
      responses:
        '200':
          description: 매칭된 지식 청크 프리뷰 목록 반환
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSearchResponse'
        '400':
          description: 유효하지 않은 검색어 (2자 미만 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 검색 엔진 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chat/sessions:
    get:
      summary: 대화 세션 목록 조회 (List Sessions)
      description: |
        데이터베이스에 영속화된 대화 세션 목록을 최근 활동순(`updated_at DESC`)으로 정렬하여 조회합니다.
        FIFO 보존 한도(최대 30개)에 따라 최근 세션 목록을 반환하며, 좌측 히스토리 사이드바 및 모바일 드로어 렌더링에 사용됩니다.
      tags: [Chat]
      parameters:
        - name: limit
          in: query
          required: false
          description: 반환할 최대 세션 수 (기본값 30, 최대 50)
          schema:
            type: integer
            default: 30
            minimum: 1
            maximum: 50
        - name: offset
          in: query
          required: false
          description: 페이징 오프셋
          schema:
            type: integer
            default: 0
            minimum: 0
      responses:
        '200':
          description: 최근 대화 세션 요약 목록 반환 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatSessionSummary'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: 대화 세션 생성 또는 업서트 (Create or Upsert Session)
      description: |
        새로운 대화 세션을 생성하거나 오프라인 동기화/메시지 배치를 업서트합니다.
        신규 세션 생성으로 전체 세션 수가 30개를 초과할 경우, `updated_at`이 가장 오래된 세션을 자동으로 FIFO 영구 축출(Auto-Eviction)합니다.
      tags: [Chat]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatSessionCreateRequest'
      responses:
        '201':
          description: 대화 세션 생성 또는 업서트 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
        '400':
          description: 유효하지 않은 요청 데이터 (UUID 포맷 오류 등)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 세션 저장 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/chat/sessions/{session_id}:
    get:
      summary: 대화 세션 상세 및 전체 메시지 이력 조회 (Get Session Detail)
      description: |
        지정된 `session_id`에 해당하는 세션 메타데이터(스코프 모드, Scoped 기사 메타데이터, 포커스 필터)와
        시간순(`created_at ASC`)으로 정렬된 전체 대화 메시지 목록을 조회합니다.
        사이드바에서 과거 세션 카드를 클릭하여 100% 완전 복원(Full Context Hydration, [FUNC-CHAT-012])할 때 사용됩니다.
      tags: [Chat]
      parameters:
        - name: session_id
          in: path
          required: true
          description: 조회할 대화 세션 UUID v4
          schema:
            type: string
            format: uuid
            example: 7b6a48f2-2973-45f6-8c46-9562725b821a
      responses:
        '200':
          description: 세션 상세 및 정렬된 대화 메시지 목록 반환 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatSessionDetail'
        '404':
          description: 요청한 세션을 찾을 수 없음 (ERR_SESSION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 서버 내부 오류
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: 대화 세션 및 연관 메시지 원자적 CASCADE 영구 삭제 (Delete Session)
      description: |
        지정된 `session_id`에 해당하는 대화 세션을 삭제합니다.
        데이터베이스 외래키 `ON DELETE CASCADE` 제약조건에 의해 해당 세션에 속한 모든 `chat_messages` 레코드가 원자적으로 동시 영구 삭제됩니다.
      tags: [Chat]
      parameters:
        - name: session_id
          in: path
          required: true
          description: 삭제할 대화 세션 UUID v4
          schema:
            type: string
            format: uuid
            example: 7b6a48f2-2973-45f6-8c46-9562725b821a
      responses:
        '200':
          description: 대화 세션 및 하위 메시지 삭제 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GenericSuccessResponse'
        '404':
          description: 대상 세션을 찾을 수 없음 (ERR_SESSION_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 세션 삭제 트랜잭션 실패 (ERR_SESSION_DELETE_FAILED)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

