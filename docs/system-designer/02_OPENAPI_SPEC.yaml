  /api/schedule/reset-and-collect:
    post:
      tags:
      - Schedule
      summary: Reset And Collect
      description: |-
        Deletes all existing news items and crawl logs, then triggers fresh progressive collection.

        ---
        [보충]
        이 프로세스가 수집 중이 아니고 수집 잠금을 쥘 수 있으면: LLM 캐시(평가·기사 질문·Ollama 판정) 비우기 → DELETE FROM news_items, DELETE FROM crawl_logs 를 한 트랜잭션으로 커밋 → 수집기 진행 카운터 초기화 → 잠금 해제 → 백그라운드 collect_all(). 잠금을 못 쥐면 아무것도 지우지 않고 already_running. 확인 절차·인증 없음. source_research_logs·chat_* 는 지우지 않는다(chat_sessions.active_source_id 는 FK 로 NULL).
      operationId: reset_and_collect_api_schedule_reset_and_collect_post
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResetAndCollectResponse'
          x-agentlens-supplemented: true
      x-agentlens-code: backend/app/api/schedule.py:64, backend/app/services/news_service.py:137
