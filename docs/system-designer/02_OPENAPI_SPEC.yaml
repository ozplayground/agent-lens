# AgentLens OpenAPI 3.1 — docs/system-designer/02_OPENAPI_SPEC.yaml
# Updated: 2026-11-10
# 기준: v0.4.2
# 생성: cd backend && PYTHONPATH=. ../.venv/bin/python ../.claude/skills/contract-specification/scripts/gen_openapi.py ../docs/system-designer/02_OPENAPI_SPEC.yaml 로 app.openapi() 를 뽑고 코드 사실을 보충했다 (lifespan 은 돌지 않는다).
# 표시: 자동 생성(/openapi.json)과 다른 곳은 x-agentlens-supplemented: true, operation 별 x-agentlens-diff.
openapi: 3.1.0
info:
  title: AgentLens
  version: 0.4.2
  description: |-
    AgentLens backend REST API (FastAPI). 기준: v0.4.2, Updated: 2026-11-10.

    이 파일은 `app.openapi()` (FastAPI 0.162.2 자동 생성, 런타임 `/openapi.json` 과 같은 내용)를 뽑은 뒤 코드에서 확인한 사실을 보충한 것이다.
    - 자동 생성과 다른 곳: 추가·교체한 응답·요청 본문·컴포넌트에는 `x-agentlens-supplemented: true`, 각 operation 에는 `x-agentlens-diff` 목록을 단다.
    - `x-agentlens-code`: 라우터·서비스 위치 (path:line). `x-agentlens-frontend`: frontend/src/lib/api.ts 호출 함수나 직접 fetch 위치.
    - 인증 없음. CORS allow_origins=['*'], allow_credentials=True (backend/app/main.py:51-57).
    - 오류 형식은 모든 operation 이 ErrorResponse {error_code, message, details} 다 (backend/app/api/errors.py). 요청 검증 실패는 422 가 아니라 400 ERR_INVALID_PAYLOAD (details [{loc, msg}]), HTTPException 은 상태 코드를 유지하고 상태별 기본 코드, 처리하지 않은 예외는 어느 operation 에서든 500 ERR_SERVER_INTERNAL (예외 문자열은 싣지 않는다).
    - 설계 문서: docs/system-designer/01_SYSTEM_DESIGN.md
  x-agentlens-supplemented: true
servers:
- url: http://localhost:8000
  description: backend (uvicorn app.main:app, BACKEND_PORT 기본 8000)
  x-agentlens-supplemented: true
- url: http://localhost:3000
  description: frontend Next rewrite (/api/:path* → INTERNAL_API_URL). / 와 /health 는 프록시하지 않는다
  x-agentlens-supplemented: true
tags:
- name: News
  description: 뉴스 목록·Ask AI(SSE)·RSS. 라우터 backend/app/api/news.py
- name: Chat
  description: AI 챗 스트림(SSE)·기사 상세·세션. 라우터 backend/app/api/chat.py
- name: Daily Briefing
  description: 오늘의 브리핑·Notion·이메일·설정. 라우터 backend/app/api/briefing.py
- name: Schedule
  description: 수집 스케줄·진행·수동 수집·리셋. 라우터 backend/app/api/schedule.py
- name: sources
  description: sources.json 소스 관리. 라우터 backend/app/api/sources.py
- name: research
  description: URL 피드 탐지·딥 리서치. 라우터 backend/app/api/research.py
- name: trends
  description: 기술 레이더. 라우터 backend/app/api/trends.py
- name: Webhook Dispatcher
  description: Slack/Discord/generic 웹훅 테스트 발송. 라우터 backend/app/api/webhook.py
- name: Stats
  description: 뉴스 개수 통계. 라우터 backend/app/api/stats.py
- name: System
  description: GET /, GET /health (backend/app/main.py). 자동 생성에는 태그가 없어 보충했다
  x-agentlens-supplemented: true
paths:
  /api/news:
    get:
      tags:
      - News
      summary: Get News Feed
      operationId: get_news_feed_api_news_get
      parameters:
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
      - name: source
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Source
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Search
      - name: high_signal_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: High Signal Only
      - name: sort
        in: query
        required: false
        schema:
          type: string
          default: hot
          title: Sort
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListResponse'
        '400':
          description: 요청 검증 실패 (ERR_INVALID_PAYLOAD)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-agentlens-code: backend/app/api/news.py:17, backend/app/services/news_service.py:58
      x-agentlens-frontend: fetchNewsFeed
      description: |-
        [보충]
        category·source 는 소문자로 바꿔 일치 비교(all 이면 필터 없음). search 는 앞뒤 공백 제거 후 title·summary·tags·tech_stack·why_it_matters 에 ILIKE %search% (OR). sort: latest(published_at desc), top(raw_score desc), quality(quality_score desc, hotness_score desc), 그 밖의 값은 모두 hot(hotness_score desc, published_at desc). offset=(page-1)*size, total_pages=ceil(total/size) (total 0 이면 1). tags·tech_stack 은 쉼표 문자열을 배열로, tldr_bullets 는 JSON 파싱(실패 시 []), quality_score 0/NULL 은 6.0 (news_service.py:28-51). published_at·created_at 은 UTC 오프셋이 붙은 ISO 문자열 (schemas/news.py:32-36). page·size 범위 밖은 400 ERR_INVALID_PAYLOAD.
      x-agentlens-diff:
      - description 보충
  /api/news/{news_id}/ask/stream:
    post:
      tags:
      - News
      summary: Ask About News Item Stream
      operationId: ask_about_news_item_stream_api_news__news_id__ask_stream_post
      parameters:
      - name: news_id
        in: path
        required: true
        schema:
          type: integer
          title: News Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskQuestionRequest'
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream:
              schema:
                type: string
                description: 'data: <NewsAskStreamEvent JSON>\n\n 의 연속'
              x-agentlens-event-schema:
                $ref: '#/components/schemas/NewsAskStreamEvent'
          x-agentlens-supplemented: true
        '400':
          description: 'ERR_INVALID_PAYLOAD: question 이 없거나 1~2000자 밖, news_id 가 정수 아님 (details [{loc, msg}])'
          x-agentlens-supplemented: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 404 ERR_NOT_FOUND "기사를 찾을 수 없습니다." (스트림을 열기 전에 확인)
          x-agentlens-supplemented: true
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      x-agentlens-code: backend/app/api/news.py:33, backend/app/services/llm_processor.py:881
      x-agentlens-frontend: askQuestionAboutNewsStream (NEXT_PUBLIC_API_URL 이 있으면 backend 직결, 없으면 같은 출처 rewrite. 직결 실패 시 상대 경로로 재시도)
      description: |
        [보충]
        프레임: `event:` 줄 없이 `data: <JSON>\n\n` (backend/app/api/news.py). 종류는 JSON 의 event 필드 (NewsAskStreamEvent).
        응답 헤더: `text/event-stream`, `Cache-Control: no-cache, no-transform`, `Connection: keep-alive`, `X-Accel-Buffering: no`.
        순서: meta → token* → done. 토큰 전에 Anthropic 이 실패하면 OpenAI, 그다음 휴리스틱(이모지 없는 규칙 답)으로 넘어간다. 엔진을 바꾸면 meta 가 다시 온다.
        토큰을 보낸 뒤 실패하거나 max_tokens 로 잘리면 error 이벤트 {event: error, error_code: ERR_LLM_STREAM_FAILED, message: '답변 생성이 중간에 끊겼습니다. 다시 시도해 주세요.', retryable: true} 로 끝나고 done 은 없다 (캐시하지 않는다).
        question 은 1~2000자 (AskQuestionRequest). 위반은 스트림을 열기 전에 400 ERR_INVALID_PAYLOAD.
        캐시 적중이면 meta 의 model 이 '<model> (캐시됨)' 이고 답을 4단어씩 token 으로 나눠 보낸다.
      x-agentlens-diff:
      - description 보충
      - 200 content 를 text/event-stream 으로 교체 (자동 생성은 application/json)
      - '오류 응답 추가: 400, 404'
