openapi: 3.1.0
info:
  title: AgentLens API
  version: 1.4.3
  description: AI 및 에이전트(Agent) 기술 소식 큐레이션 및 인텔리전스 RESTful API 규격서
paths:
  /api/news:
    get:
      summary: 뉴스 피드 목록 조회
      tags: [news]
      parameters:
        - name: category
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: source
          in: query
          required: false
          schema:
            type: string
            default: all
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: sort
          in: query
          required: false
          schema:
            type: string
            default: hot
        - name: high_signal_only
          in: query
          required: false
          schema:
            type: boolean
            default: false
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            default: 18
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsListResponse'
  /api/news/{id}:
    get:
      summary: 뉴스 아이템 단건 상세 조회
      tags: [news]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsItemResponse'
        '404':
          description: 소식을 찾을 수 없음
  /api/news/{id}/ask:
    post:
      summary: 특정 뉴스에 대한 대화형 AI 질의응답
      tags: [news]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AskQuestionRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskQuestionResponse'
  /api/news/reset:
    post:
      summary: 데이터베이스 초기화 및 초기 수집
      tags: [news]
      responses:
        '200':
          description: 초기화 완료
  /api/briefing/latest:
    get:
      summary: 오늘의 AI 브리핑 조회
      tags: [briefing]
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBriefingResponse'
  /api/briefing/generate:
    post:
      summary: 오늘의 AI 브리핑 강제 재생성
      tags: [briefing]
      responses:
        '200':
          description: 생성 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyBriefingResponse'
  /api/briefing/export/notion:
    post:
      summary: Notion 페이지로 브리핑 내보내기
      tags: [briefing]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NotionExportRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotionExportResponse'
  /api/briefing/export/email:
    post:
      summary: 이메일로 브리핑 발송
      tags: [briefing]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailSendRequest'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmailSendResponse'
  /api/briefing/settings:
    get:
      summary: 브리핑 연동 설정 조회 (마스킹)
      tags: [briefing]
      responses:
        '200':
          description: 설정 데이터
    put:
      summary: 브리핑 연동 설정 갱신
      tags: [briefing]
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BriefingSettingsUpdate'
      responses:
        '200':
          description: 갱신 성공
  /api/sources:
    get:
      summary: 등록된 수집 소스 전체 목록 및 통계
      tags: [sources]
      responses:
        '200':
          description: 소스 목록
  /api/sources/rss:
    post:
      summary: 신규 RSS 피드 등록
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRssRequest'
      responses:
        '200':
          description: 등록 성공
  /api/sources/github:
    post:
      summary: 신규 GitHub 모니터링 레포 등록
      tags: [sources]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddGitHubRepoRequest'
      responses:
        '200':
          description: 등록 성공
  /api/sources/{source_type}/{item_id}/toggle:
    patch:
      summary: 소스 수집 활성화/비활성화 토글
      tags: [sources]
      parameters:
        - name: source_type
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 토글 성공
  /api/sources/{source_type}/{item_id}:
    delete:
      summary: 소스 삭제
      tags: [sources]
      parameters:
        - name: source_type
          in: path
          required: true
          schema:
            type: string
        - name: item_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 삭제 성공
  /api/schedule:
    get:
      summary: 정기 수집 스케줄 현황
      tags: [schedule]
      responses:
        '200':
          description: 현황 데이터
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduleStatusResponse'
  /api/schedule/run-now:
    post:
      summary: 즉시 수동 수집 실행
      tags: [schedule]
      responses:
        '200':
          description: 수집 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManualCollectResponse'
        '409':
          description: 이미 수집 진행 중
  /api/stats:
    get:
      summary: 전체 통계 데이터
      tags: [stats]
      responses:
        '200':
          description: 통계
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
  /api/trends/tech-radar:
    get:
      summary: Tech Radar 트렌드 데이터
      tags: [trends]
      responses:
        '200':
          description: 트렌드 데이터
  /api/webhook/test:
    post:
      summary: 슬랙/디스코드 웹훅 테스트 알림
      tags: [webhook]
      responses:
        '200':
          description: 전송 결과
components:
  schemas:
    NewsItemResponse:
      type: object
      properties:
        id: { type: integer }
        title: { type: string }
        url: { type: string }
        source: { type: string }
        category: { type: string }
        summary: { type: string }
        author: { type: string, nullable: true }
        tags:
          type: array
          items: { type: string }
        tldr_bullets:
          type: array
          items: { type: string }
        why_it_matters: { type: string }
        tech_stack:
          type: array
          items: { type: string }
        quality_score: { type: number }
        is_high_signal: { type: boolean }
        raw_score: { type: integer }
        comments_count: { type: integer }
        hotness_score: { type: number }
        published_at: { type: string, format: date-time }
        created_at: { type: string, format: date-time }
        dedup_hash: { type: string }
      required: [id, title, url, source, category, quality_score, published_at, dedup_hash]
    NewsListResponse:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/NewsItemResponse' }
        total: { type: integer }
        page: { type: integer }
        size: { type: integer }
        total_pages: { type: integer }
      required: [items, total, page, size, total_pages]
    AskQuestionRequest:
      type: object
      properties:
        question: { type: string }
      required: [question]
    AskQuestionResponse:
      type: object
      properties:
        news_id: { type: integer }
        question: { type: string }
        answer: { type: string }
        model_used: { type: string, nullable: true }
      required: [news_id, question, answer]
    DailyBriefingResponse:
      type: object
      properties:
        title: { type: string }
        date: { type: string }
        headline: { type: string }
        overview: { type: string }
        categories:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              name: { type: string }
              icon: { type: string }
              summary: { type: string }
              items:
                type: array
                items: { type: object }
        action_items:
          type: array
          items: { type: string }
        markdown_report: { type: string }
        featured_items_count: { type: integer }
        generated_at: { type: string }
      required: [date, headline, markdown_report, featured_items_count]
    AddRssRequest:
      type: object
      properties:
        name: { type: string }
        url: { type: string }
        site_url: { type: string }
        category_hint: { type: string, default: ai_news }
        country: { type: string, default: GLOBAL }
        description: { type: string }
      required: [name, url]
    AddGitHubRepoRequest:
      type: object
      properties:
        repo: { type: string }
        category: { type: string, default: agent_tech }
        description: { type: string }
        stars_hint: { type: integer, default: 0 }
      required: [repo]
    NotionExportRequest:
      type: object
      properties:
        api_key: { type: string }
        page_id: { type: string }
    NotionExportResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
        url: { type: string, nullable: true }
      required: [success, message]
    EmailSendRequest:
      type: object
      properties:
        to_email: { type: string }
        subject: { type: string }
    EmailSendResponse:
      type: object
      properties:
        success: { type: boolean }
        message: { type: string }
      required: [success, message]
    BriefingSettingsUpdate:
      type: object
      properties:
        notion_api_key: { type: string }
        notion_page_id: { type: string }
        notion_auto_export: { type: boolean }
        smtp_host: { type: string }
        smtp_port: { type: integer }
        smtp_user: { type: string }
        smtp_password: { type: string }
        smtp_from: { type: string }
        smtp_to: { type: string }
        smtp_use_tls: { type: boolean }
        email_auto_send: { type: boolean }
        slack_webhook_url: { type: string }
        discord_webhook_url: { type: string }
    ScheduleStatusResponse:
      type: object
      properties:
        current_time: { type: string }
        schedule_hours:
          type: array
          items: { type: integer }
        timezone: { type: string }
        next_run: { type: string }
        minutes_until_next_run: { type: number }
        is_running: { type: boolean }
        last_crawl_time: { type: string, nullable: true }
        last_crawl_status: { type: string }
        recent_logs:
          type: array
          items: { type: object }
      required: [current_time, schedule_hours, timezone, next_run, is_running]
    StatsResponse:
      type: object
      properties:
        total_news: { type: integer }
        category_counts:
          type: object
          additionalProperties: { type: integer }
        source_counts:
          type: object
          additionalProperties: { type: integer }
        last_updated: { type: string, nullable: true }
      required: [total_news, category_counts, source_counts]
    ManualCollectResponse:
      type: object
      properties:
        message: { type: string }
        total_collected: { type: integer }
        total_saved: { type: integer }
        source_results: { type: object }
      required: [message, total_collected, total_saved]
