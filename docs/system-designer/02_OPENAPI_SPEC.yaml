# AgentLens OpenAPI 3.1 — docs/system-designer/02_OPENAPI_SPEC.yaml
# Updated: 2026-11-09
# 기준: v0.4.1 (main)
# 생성: cd backend && PYTHONPATH=. ../.venv/bin/python ../.claude/skills/contract-specification/scripts/gen_openapi.py ../docs/system-designer/02_OPENAPI_SPEC.yaml 로 app.openapi() 를 뽑고 코드 사실을 보충했다 (lifespan 은 돌지 않는다).
# 표시: 자동 생성(/openapi.json)과 다른 곳은 x-agentlens-supplemented: true, operation 별 x-agentlens-diff.
openapi: 3.1.0
info:
  title: AgentLens
  version: 0.4.1
  description: |-
    AgentLens backend REST API (FastAPI). 기준: v0.4.1 (main), Updated: 2026-11-09.

    이 파일은 `app.openapi()` (FastAPI 0.162.2 자동 생성, 런타임 `/openapi.json` 과 같은 내용)를 뽑은 뒤 코드에서 확인한 사실을 보충한 것이다.
    - 자동 생성과 다른 곳: 추가·교체한 응답·요청 본문·컴포넌트에는 `x-agentlens-supplemented: true`, 각 operation 에는 `x-agentlens-diff` 목록을 단다.
    - `x-agentlens-code`: 라우터·서비스 위치 (path:line). `x-agentlens-frontend`: frontend/src/lib/api.ts 호출 함수나 직접 fetch 위치.
    - 인증 없음. CORS allow_origins=['*'], allow_credentials=True (backend/app/main.py:50).
    - 오류 형식이 라우터마다 다르다: HTTPExceptionDetail {detail}, FastAPI 422 HTTPValidationError, chat ErrorResponse {error_code, message, details}, 전역 500 GlobalErrorResponse {detail, error}. 처리하지 않은 예외는 어느 operation 에서든 GlobalErrorResponse 500 이 된다 (명시하지 않은 곳 포함).
    - 설계 문서: docs/system-designer/01_SYSTEM_DESIGN.md
  x-agentlens-supplemented: true
servers:
- url: http://localhost:8000
  description: backend (uvicorn app.main:app, BACKEND_PORT 기본 8000)
  x-agentlens-supplemented: true
- url: http://localhost:3000
  description: frontend Next rewrite (/api/:path* → INTERNAL_API_URL). / 와 /health 는 프록시하지 않는다
  x-agentlens-supplemented: true
tags:
- name: News
  description: 뉴스 목록·단건·Ask AI(동기·SSE)·RSS. 라우터 backend/app/api/news.py
- name: Chat
  description: AI 챗 질의(동기·SSE)·코퍼스 검색·세션. 라우터 backend/app/api/chat.py. 오류는 ErrorResponse
- name: Daily Briefing
  description: 브리핑 생성·Notion·이메일·설정. 라우터 backend/app/api/briefing.py
- name: Schedule
  description: 수집 스케줄·진행·수동 수집·리셋. 라우터 backend/app/api/schedule.py
- name: sources
  description: sources.json 소스 관리. 라우터 backend/app/api/sources.py
- name: research
  description: URL 탐지·후보 추천·딥 리서치. 라우터 backend/app/api/research.py
- name: trends
  description: 기술 레이더. 라우터 backend/app/api/trends.py
- name: Webhook Dispatcher
  description: Slack/Discord/generic 웹훅. 라우터 backend/app/api/webhook.py
- name: Stats
  description: 뉴스 개수 통계. 라우터 backend/app/api/stats.py
- name: MCP
  description: MCP 서버 정보. 라우터 backend/app/api/mcp.py
- name: System
  description: GET /, GET /health (backend/app/main.py). 자동 생성에는 태그가 없어 보충했다
  x-agentlens-supplemented: true
paths:
