<!doctype html>
<!--
  ui-audit --self-test 의 개발 서버 페이지 (spec 14.8, R31).
  Next.js 개발 서버(next dev)는 화면 구석에 개발 표시기를 <nextjs-portal> 으로 그린다. 이 요소가 있으면
  ui-audit 은 측정을 멈추고 '개발 서버' 환경 오류(종료 2)로 끝나야 한다.
-->
<html lang="ko">
<head>
<meta charset="utf-8">
<title>ui-audit dev indicator</title>
<style>
  body { margin: 0; padding: 24px; font: 14px/20px -apple-system, "Apple SD Gothic Neo", sans-serif; }
  nextjs-portal { position: fixed; left: 16px; bottom: 16px; width: 36px; height: 36px; border-radius: 50%; background: #000; }
</style>
</head>
<body>
  <main>
    <h1>개발 서버 페이지</h1>
    <button type="button">즉시 수집</button>
  </main>
  <nextjs-portal></nextjs-portal>
</body>
</html>
