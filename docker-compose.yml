# =================================================================
# AgentLens Unified Docker Compose Deployment
# - Backend: FastAPI 0.141 + APScheduler + SQLite (Port 8000)
# - Frontend: Next.js 16 Standalone (Port 3001)
# =================================================================

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agentlens-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - PROJECT_NAME=AgentLens
      - VERSION=${VERSION:-0.4.2}
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite+aiosqlite:///./data/agentlens.db
      - PUBLIC_WEB_URL=${PUBLIC_WEB_URL:-http://localhost:${FRONTEND_PORT:-3001}}
      - SECRET_KEY=${SECRET_KEY:-agentlens-default-secret-key-32chars-minimum-safe-value}
      # 스케줄: 루트 .env 나 셸에 정했을 때만 넘긴다. 정하지 않으면 config.json scheduler.* 를 쓴다.
      # 빈 값(VAR=)으로 정하지 않는다: 빈 문자열도 그대로 넘어가고 Settings 가 숫자·불리언으로 읽지 못해 기동이 멈춘다
      - CRAWL_SCHEDULE_HOURS
      - CRAWL_TIMEZONE
      - SCHEDULER_ENABLED
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ANTHROPIC_MODEL=${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      - ANTHROPIC_DEFAULT_CHAT_MODEL=${ANTHROPIC_DEFAULT_CHAT_MODEL:-claude-sonnet-5-5}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.5-flash-lite}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL=${OPENAI_MODEL:-gpt-4o-mini}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - SLACK_WEBHOOK_URL=${SLACK_WEBHOOK_URL:-}
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
    volumes:
      - agentlens-data:/app/data
      - ./config.json:/app/config.json:rw
      - ./sources.json:/app/sources.json:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - agentlens-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: agentlens-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3001"
    environment:
      - NODE_ENV=production
      - PORT=3001
      - INTERNAL_API_URL=http://backend:8000
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - agentlens-network

volumes:
  agentlens-data:
    name: agentlens-data
    driver: local

networks:
  agentlens-network:
    name: agentlens-network
    driver: bridge
